[workspace]
resolver = "2"
members = [
  "rust/plum-wasm",
  "rust/plum-macro",
  "examples/todomvc/model",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
leptos = { version = "0.8", default-features = false }
reactive_graph = { version = "0.2", features = ["effects"] }
any_spawner = "0.3"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
serde_json = "1"
ts-rs = "12"
plum-wasm = { path = "rust/plum-wasm" }
plum-macro = { path = "rust/plum-macro" }
