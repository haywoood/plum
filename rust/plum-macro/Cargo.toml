[package]
name = "plum-macro"
version = "0.1.0"
edition = "2021"
description = "Macros for plum: generate the wasm-bindgen class and the TypeScript binding for a Leptos model."

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
